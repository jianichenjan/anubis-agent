[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anubis-agent"
version = "0.1.0"
description = "A summonable stateless governance agent with deterministic enforcement"
requires-python = ">=3.10"

[project.scripts]
anubis-gate = "anubis.gate:main"
anubis-summon = "anubis.summon:main"
